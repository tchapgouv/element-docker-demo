# Utilise le même nom de réseau que dans compose-tchap-light.yml
networks:
  backend:
    name: tchap_backend

services:
  postgres-keycloak:
    image: postgres
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=postgres
      - PGDATA=/var/lib/postgresql/data
    secrets: []  # Explicitement vide pour éviter d'hériter des secrets du fichier principal
    volumes:
      - ${VOLUME_PATH}/tmp/postgres:/var/lib/postgresql/data:rw
      - ${VOLUME_PATH}/tchap/keycloak/init-keycloak-db.sql:/docker-entrypoint-initdb.d/init-keycloak-db.sql
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 50
      
  identity-mock:
    image: wiremock/wiremock:2.35.0
    ports:
      - "${IDENTITY_MOCK_PORT:-8080}:8080"
    volumes:
      - ${VOLUME_PATH}/tchap/wiremock:/home/wiremock
    command:
      - --verbose
      - --global-response-templating
    networks:
      - backend
    # This service mocks the Matrix Identity Server API
    
  keycloak:
    image: quay.io/keycloak/keycloak:26.2
    ports:
      - "${KEYCLOAK_PORT:-8081}:8080"
    environment:
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin
      - KC_DB=postgres
      - KC_DB_URL=jdbc:postgresql://postgres-keycloak:5432/keycloak
      - KC_DB_USERNAME=postgres
      - KC_DB_PASSWORD=postgres
    volumes:
      - ${VOLUME_PATH}/tchap/keycloak/proconnect-mock-realm.json:/opt/keycloak/data/import/proconnect-mock-realm.json
    command: "start-dev --import-realm --hostname=${KEYCLOAK_HOSTNAME:-localhost}"
    networks:
      - backend
    depends_on:
      postgres-keycloak:
        condition: service_healthy


  tchap-web:
    image: develop_tchap:latest
    restart: unless-stopped
    # ports:
    #   - 8080:80
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:80/version || exit 1"]
      start_period: "5s"
      interval: "15s"
      timeout: "5s"
    networks:
      - backend
    volumes:
      - ${VOLUME_PATH}/data/tchap-web/config.local.json:/app/config.json
    depends_on:
      init:
        condition: service_completed_successfully
