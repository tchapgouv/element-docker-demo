http:
  listeners:
    - name: web
      resources:
        - name: discovery
        - name: human
        - name: oauth
        - name: compat
        - name: graphql
        - name: assets
      # for api admin calls
        - name: adminapi
      binds:
        - address: '[::]:8080'
      proxy_protocol: false
    - name: internal
      resources:
        - name: health
        # for api admin calls
        - name: adminapi
      binds:
        - host: localhost
          port: 8081
      proxy_protocol: false
  trusted_proxies:
    - 192.168.0.0/16
    - 172.16.0.0/12
    - 10.0.0.0/10
    - 127.0.0.1/8
    - fd00::/8
    - ::1/128
  #  public_base: http://[::]:8080/
  #  issuer: http://[::]:8080/
  public_base: https://${MAS_FQDN}/
  issuer: https://${DOMAIN}/
database:
  host: postgres
  database: mas
  username: matrix
  password: ${SECRETS_POSTGRES_PASSWORD}
  max_connections: 10
  min_connections: 0
  connect_timeout: 30
  idle_timeout: 600
  max_lifetime: 1800
email:
  from: '${MAS_EMAIL_FROM}'
  reply_to: '${MAS_EMAIL_REPLY_TO}'
  transport: smtp
  mode: plain
  hostname: ${SMTP_HOST}
  port: ${SMTP_PORT}

${SECRETS_MAS_SECRETS}


passwords:
  enabled: true
  schemes:
    - version: 1
      algorithm: bcrypt
      secret: "secret01"
    - version: 2
      algorithm: argon2id
  minimum_complexity: 3
matrix:
  homeserver: ${DOMAIN}
  secret: '${SECRETS_MAS_MATRIX_SECRET}'
  endpoint: https://${HOMESERVER_FQDN}/

clients:
  - client_id: ${MAS_CLIENT_ID}
    client_auth_method: client_secret_basic
    client_secret: '${SECRETS_MAS_CLIENT_SECRET}'
  
  # for api admin calls
  - client_id: 01J44RKQYM4G3TNVANTMTDYTX6
    client_auth_method: client_secret_basic
    client_secret: phoo8ahneir3ohY2eigh4xuu6Oodaewi


policy:
  data:
    admin_clients:
      # for api admin calls
      - 01J44RKQYM4G3TNVANTMTDYTX6
    client_registration:
      allow_insecure_uris: true
      allow_host_mismatch: true

account:
  # Whether users are allowed to change their email addresses.
  #
  # Defaults to `true`.
  email_change_allowed: false

  # Whether users are allowed to change their display names
  #
  # Defaults to `true`.
  # This should be in sync with the policy in the homeserver configuration.
  displayname_change_allowed: false

  # Whether to enable self-service password registration
  #
  # Defaults to `false`.
  # This has no effect if password login is disabled.
  password_registration_enabled: true

  # Whether users are allowed to change their passwords
  #
  # Defaults to `true`.
  # This has no effect if password login is disabled.
  password_change_allowed: true

  # Whether email-based password recovery is enabled
  #
  # Defaults to `false`.
  # This has no effect if password login is disabled.
  password_recovery_enabled: true

  # Whether users can log in with their email address.
  #
  # Defaults to `false`.
  # This has no effect if password login is disabled.
  login_with_email_allowed: true

templates:
  path: /usr/local/share/mas-cli/templates/
  assets_manifest: /usr/local/share/mas-cli/manifest.json
  translations_path: /usr/local/share/mas-cli/translations/

upstream_oauth2:
  providers:
    - id: "01JK5MR1SD21MAQY4PWMFG283W"
      human_name: Proconnect (mock)
      issuer: "https://sso.tchapgouv.com/realms/proconnect-mock"
      token_endpoint_auth_method: client_secret_basic
      client_id: "matrix-authentication-service"
      client_secret: "HrJ1NZ0AbkHuWWjyRHh7X2lzn3S8eagt"
      scope: "openid profile email"
      claims_imports:
        localpart:
          action: force 
          #template: "{{ user.preferred_username }}"
          on_conflict: add
          #action: require
          template: "{{ user.email | email_to_mxid_localpart }}"
        displayname:
          action: require
          #template: "{{ user.name }}"
          template: "{{ user.email | email_to_display_name }}"
        email:
          action: require
          template: "{{ user.email }}"
          set_email_verification: always

telemetry:
  tracing:
  #   # List of propagators to use for extracting and injecting trace contexts
  #   propagators:
  #     # Propagate according to the W3C Trace Context specification
  #     - tracecontext
  #     # Propagate according to the W3C Baggage specification
  #     - baggage
  #     # Propagate trace context with Jaeger compatible headers
  #     - jaeger

  #   # The default: don't export traces
    exporter: none

    # Export traces to an OTLP-compatible endpoint
    #exporter: otlp
    #endpoint: https://localhost:4318
  metrics:
    # The default: don't export metrics
    exporter: none

    # Export metrics to an OTLP-compatible endpoint
    #exporter: otlp
    #endpoint: https://localhost:4317

    # Export metrics by exposing a Prometheus endpoint
    # This requires mounting the `prometheus` resource to an HTTP listener
    #exporter: prometheus

  # sentry:
  #   # DSN to use for sending errors and crashes to Sentry
  #   dsn: https://public@host:port/1

experimental:
  # Time-to-live of OAuth 2.0 access tokens in seconds. Defaults to 300, 5 minutes.
  access_token_ttl: 30

  # Time-to-live of compatibility access tokens in seconds, when refresh tokens are supported. Defaults to 300, 5 minutes.
  #compat_token_ttl: 300

  # Experimental feature to automatically expire inactive sessions
  # Disabled by default
  #inactive_session_expiration:
     # Time after which an inactive session is automatically finished in seconds
     #ttl: 32400

     # Should compatibility sessions expire after inactivity. Defaults to true.
     #expire_compat_sessions: true

     # Should OAuth 2.0 sessions expire after inactivity. Defaults to true.
     #expire_oauth_sessions: true

     # Should user sessions expire after inactivity. Defaults to true.
     #expire_user_sessions: true

tchap:
  identity_server_url: "http://host.docker.internal:8083"
  email_lookup_fallback_rules: 
  # match : the new email pattern
  # search : the old email pattern
  # old email in mail.numerique.gouv.fr
  - match_with : '@numerique.gouv.fr'
    search: '@beta.gouv.fr'


rate_limiting:
 # Limits how many account recovery attempts are allowed.
  # These limits can protect against e-mail spam.
  #
  # Note: these limit also apply to recovery e-mail re-sends.
  account_recovery:
    # Controls how many account recovery attempts are permitted
    # based on source IP address.
    per_ip:
      burst: 3
      per_second: 0.0008

    # Controls how many account recovery attempts are permitted
    # based on the e-mail address that is being used for recovery.
    per_address:
      burst: 3
      per_second: 0.0002

  # Limits how many login attempts are allowed.
  #
  # Note: these limit also applies to password checks when a user attempts to
  # change their own password.
  login:
    # Controls how many login attempts are permitted
    # based on source IP address.
    # This can protect against brute force login attempts.
    per_ip:
      burst: 3
      per_second: 0.05

    # Controls how many login attempts are permitted
    # based on the account that is being attempted to be logged into.
    # This can protect against a distributed brute force attack
    # but should be set high enough to prevent someone's account being
    # casually locked out.
    per_account:
      burst: 1800
      per_second: 0.5

  # Limits how many registrations attempts are allowed,
  # based on source IP address.
  # This limit can protect against e-mail spam and against people registering too many accounts.
  registration:
    burst: 500
    per_second: 0.0008